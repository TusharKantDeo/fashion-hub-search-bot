[project]
name = "fashion-hub-search-bot"
version = "0.1.0"
description = "RAG search bot for a fashion store, built on a reusable rag_kit module"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "weaviate-client>=4.16",
    "opentelemetry-api>=1.25",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
tracing = ["arize-phoenix-otel>=0.10"]
phoenix-server = ["arize-phoenix>=11.0"]  # only if running Phoenix without Docker
all = ["sentence-transformers>=3.0", "arize-phoenix-otel>=0.10"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag_kit*", "fashion_hub*"]

[tool.setuptools.package-data]
fashion_hub = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
